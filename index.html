<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="form-card">
      <div class="form-header">
        <h1>Student Enrollment Form</h1>
        <p>B.Tech First-Year Academic Registration (2026–27)</p>
      </div>

      <form id="regForm" novalidate>
        <div class="field">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" placeholder="Enter your full name" />
          <span class="err" id="errName"></span>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="email">College / Personal Email *</label>
            <input type="email" id="email" placeholder="student@example.com" />
            <span class="err" id="errEmail"></span>
          </div>

          <div class="field">
            <label for="mobile">Mobile Number (10 digits) *</label>
            <input type="tel" id="mobile" maxlength="10" placeholder="9876543210" />
            <span class="err" id="errMobile"></span>
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="course">Select Branch / Course *</label>
            <select id="course">
              <option value="">-- Choose Branch --</option>
              <option value="B.Tech CSE">B.Tech Computer Science (CSE)</option>
              <option value="B.Tech CSE (AI & ML)">B.Tech CSE (AI & ML)</option>
              <option value="B.Tech IT">B.Tech Information Technology</option>
              <option value="B.Tech ECE">B.Tech Electronics & Comm.</option>
            </select>
            <span class="err" id="errCourse"></span>
          </div>

          <div class="field">
            <label>Gender *</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="Male" /> Male</label>
              <label><input type="radio" name="gender" value="Female" /> Female</label>
              <label><input type="radio" name="gender" value="Other" /> Other</label>
            </div>
            <span class="err" id="errGender"></span>
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="password">Create Password *</label>
            <input type="password" id="password" placeholder="Min. 6 characters" />
            <span class="err" id="errPass"></span>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" />
            <span class="err" id="errConfirm"></span>
          </div>
        </div>

        <button type="submit" class="submit-btn">Complete Registration</button>
      </form>

      <div id="successBox" class="success-box hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
